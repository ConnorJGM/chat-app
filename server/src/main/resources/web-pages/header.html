<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

            min-height: 100vh;

            flex-direction: column;
        }
        main.container {
            width: 80%;
            max-width: 80%;
            margin: 0 auto;
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }
        #chatlog {
            border: 1px solid #ccc;
            height: 450px;
            overflow: auto;
            margin-bottom: 1em;
            padding: 0.5em;
            background: #f8f9fa;
            white-space: pre-wrap;
        }
    </style>
</head>

    <header class="bg-primary text-white text-center py-3 mb-4">
        <h1>{{heading}}</h1>
