<div class="d-flex flex-column justify-center align-items-center" style="min-height: 60vh">
    <div class="card mb-4 w-75 mx-auto" style="min-height: 60vh;">
        <div class="card-body d-flex flex-column justify-content-center align-items-center" style="height: 80%;">
            <h2 class="card-title">Dashboard</h2>
            <p class="card-text"><strong>Uptime: </strong>
                <span id="uptime">%s</span>
            </p>
            <p class="card-text"><strong>Connected Users: </strong>
                <span id="userCount"> %d</span>
            </p>
            <script src="/web-pages/javascript/dashboard.js"></script>

            <a href="/users" class="btn btn-primary mt-3">View Connected Users</a>
            <form action="/restart" method="post" class="mt-3">
                <button id="restartButton" class="btn btn-warning">Restart Server</button>
            </form>
        </div>
    </div>
</div>
